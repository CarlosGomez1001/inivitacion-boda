services:
  postgres:
    image: postgres:16-alpine
    container_name: invitacion_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: invitacion
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: invitacion_boda
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

# El servicio "backend" y "nginx" se agregan en la Fase 2.7 (empaquetado
# completo con Docker para desplegar en la VM de GCloud).

volumes:
  pgdata:
