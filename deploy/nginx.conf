server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    # Resolver de Docker: permite que nginx resuelva "backend" en tiempo de
    # petición (no al arrancar), para no fallar si el contenedor del backend
    # todavía no está listo cuando nginx inicia.
    resolver 127.0.0.11 valid=10s;

    # Backend (API)
    location /api/ {
        set $backend_upstream http://backend:4000;
        # Con proxy_pass basado en variable, nginx NO anexa la URI original
        # automáticamente: hay que hacerlo explícito con $request_uri.
        proxy_pass $backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend estático (build de Vite)
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}

# Cuando exista un dominio apuntando a esta VM (pendiente por ahora):
#   1. sudo apt install certbot python3-certbot-nginx
#   2. sudo certbot --nginx -d tu-dominio.com
# Certbot agrega automáticamente el bloque "listen 443 ssl" y la
# redirección 80 -> 443, además de programar la renovación automática.
